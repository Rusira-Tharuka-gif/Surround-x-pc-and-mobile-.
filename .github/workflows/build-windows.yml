name: Build Windows Desktop (.exe)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        working-directory: ${{ runner.temp }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repoDir = Join-Path $env:RUNNER_TEMP "repo"
          if (Test-Path $repoDir) {
            Remove-Item -Recurse -Force $repoDir
          }
          New-Item -ItemType Directory -Path $repoDir -Force | Out-Null
          git -C $repoDir init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repoDir remote add origin "https://github.com/${{ github.repository }}.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $basicAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GITHUB_TOKEN)"))
          git -C $repoDir -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basicAuth" fetch --depth=1 origin "${{ github.ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repoDir checkout --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/repo
        run: npm install --legacy-peer-deps --include=optional

      - name: Verify / Repair Windows Native Bindings
        working-directory: ${{ runner.temp }}/repo
        shell: pwsh
        run: |
          $repairScript = @'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const npmCmd = process.platform === 'win32' ? 'npm.cmd' : 'npm';

          function tryLoad(id) {
            try {
              require(id);
              return null;
            } catch (err) {
              return err;
            }
          }

          function installBatch(specs) {
            if (!specs.length) return;
            console.log('[ci] Installing Windows native packages:', specs.join(' '));
            execFileSync(
              npmCmd,
              ['install', '--no-save', '--legacy-peer-deps', '--include=optional', '--force', ...specs],
              { stdio: 'inherit', shell: true }
            );
          }

          function unpackPackageIntoNodeModules(spec, pkgDirName) {
            const tmpDir = fs.mkdtempSync(path.join(process.cwd(), '.pkg-unpack-'));
            try {
              execFileSync(npmCmd, ['pack', spec], { cwd: tmpDir, stdio: 'inherit', shell: true });
              const tgz = fs.readdirSync(tmpDir).find((f) => f.endsWith('.tgz'));
              if (!tgz) throw new Error('npm pack produced no tarball for ' + spec);
              const destDir = path.join(process.cwd(), 'node_modules', ...pkgDirName.split('/'));
              fs.mkdirSync(destDir, { recursive: true });
              execFileSync('tar', ['-xzf', path.join(tmpDir, tgz), '--strip-components=1', '-C', destDir], {
                stdio: 'inherit',
              });
            } finally {
              fs.rmSync(tmpDir, { recursive: true, force: true });
            }
          }

          function ensureVcRedistIfNeeded(err) {
            if (!err || err.code === 'MODULE_NOT_FOUND' || process.platform !== 'win32') return false;
            console.warn('[ci] Native .node load failed (' + (err.code || err.message) + '); installing VC++ 2015-2022 x64 Redistributable...');
            execFileSync(
              'pwsh',
              [
                '-NoProfile',
                '-Command',
                "$vc = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'; Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $vc; $p = Start-Process -FilePath $vc -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru; if ($p.ExitCode -notin 0, 1638, 3010) { throw \"vc_redist exit $($p.ExitCode)\" }",
              ],
              { stdio: 'inherit' }
            );
            return true;
          }

          const rolldownVer = require('./node_modules/rolldown/package.json').version;
          const lightningVer = require('./node_modules/lightningcss/package.json').version;
          const oxideVer = require('./node_modules/@tailwindcss/oxide/package.json').version;

          const targets = [
            { pkg: '@rolldown/binding-win32-x64-msvc', ver: rolldownVer },
            { pkg: 'lightningcss-win32-x64-msvc', ver: lightningVer },
            { pkg: '@tailwindcss/oxide-win32-x64-msvc', ver: oxideVer },
          ];

          const missingSpecs = [];
          for (const t of targets) {
            const err = tryLoad(t.pkg);
            if (err && err.code === 'MODULE_NOT_FOUND') {
              missingSpecs.push(t.pkg + '@' + t.ver);
            }
          }
          installBatch(missingSpecs);

          for (const t of targets) {
            const err = tryLoad(t.pkg);
            if (err && err.code === 'MODULE_NOT_FOUND') {
              console.warn('[ci] Fallback unpacking ' + t.pkg + '@' + t.ver + ' directly into node_modules');
              unpackPackageIntoNodeModules(t.pkg + '@' + t.ver, t.pkg);
            }
          }

          let rolldownErr = tryLoad('@rolldown/binding-win32-x64-msvc');
          if (rolldownErr) {
            console.warn('[ci] @rolldown/binding-win32-x64-msvc load error:', rolldownErr.code || '', rolldownErr.message);
            if (ensureVcRedistIfNeeded(rolldownErr)) {
              rolldownErr = tryLoad('@rolldown/binding-win32-x64-msvc');
            }
          }

          if (rolldownErr) {
            console.warn('[ci] Native rolldown unavailable (' + rolldownErr.message + '); installing WASI fallback');
            const wasiSpec = '@rolldown/binding-wasm32-wasi@' + rolldownVer;
            installBatch([wasiSpec, '@napi-rs/wasm-runtime@1.2.6', '@emnapi/core@2.0.0-beta.2', '@emnapi/runtime@2.0.0-beta.2']);
            if (tryLoad('@rolldown/binding-wasm32-wasi')?.code === 'MODULE_NOT_FOUND') {
              unpackPackageIntoNodeModules(wasiSpec, '@rolldown/binding-wasm32-wasi');
            }
            const wasiErr = tryLoad('@rolldown/binding-wasm32-wasi');
            if (wasiErr) {
              throw wasiErr;
            }
          } else {
            console.log('[ci] Native @rolldown/binding-win32-x64-msvc loaded OK');
          }
          '@
          $repairScript | node --input-type=commonjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "Promise.all([import('rolldown/parseAst'), import('@tailwindcss/vite')]).then(() => console.log('[ci] rolldown and tailwindcss bindings OK')).catch((e) => { console.error(e); process.exit(1); })"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck and run unit tests
        working-directory: ${{ runner.temp }}/repo
        run: |
          npm run lint
          npm test

      - name: Verify Electron & Windows icon assets
        working-directory: ${{ runner.temp }}/repo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'build' -Force | Out-Null
          if (-not (Test-Path 'build/icon.ico') -and (Test-Path 'electron/icon.ico')) {
            Copy-Item 'electron/icon.ico' 'build/icon.ico' -Force
          }
          if (-not (Test-Path 'build/icon.png') -and (Test-Path 'electron/icon.png')) {
            Copy-Item 'electron/icon.png' 'build/icon.png' -Force
          }
          $required = @('build/icon.ico', 'build/icon.png', 'electron/icon.ico', 'electron/icon.png')
          foreach ($file in $required) {
            if (-not (Test-Path $file) -or ((Get-Item $file).Length -eq 0)) {
              throw "Missing or empty required icon asset: $file"
            }
          }

      - name: Build web bundle
        working-directory: ${{ runner.temp }}/repo
        run: npm run build

      - name: Package Windows NSIS & Portable (.exe)
        working-directory: ${{ runner.temp }}/repo
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Surround-X-Windows-exe
          path: ${{ runner.temp }}/repo/release/*.exe
          if-no-files-found: error
