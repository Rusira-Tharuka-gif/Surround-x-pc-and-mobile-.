name: Build Windows Desktop (.exe)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        working-directory: ${{ runner.temp }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repoDir = Join-Path $env:RUNNER_TEMP "repo"
          if (Test-Path $repoDir) {
            Remove-Item -Recurse -Force $repoDir
          }
          New-Item -ItemType Directory -Path $repoDir -Force | Out-Null
          git -C $repoDir init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repoDir remote add origin "https://github.com/${{ github.repository }}.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $basicAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GITHUB_TOKEN)"))
          git -C $repoDir -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basicAuth" fetch --depth=1 origin "${{ github.ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $repoDir checkout --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/repo
        run: npm install --legacy-peer-deps --include=optional

      - name: Verify / Repair Windows Native Bindings
        working-directory: ${{ runner.temp }}/repo
        shell: pwsh
        run: |
          @'
          const { execFileSync } = require('node:child_process');
          const npmCmd = process.platform === 'win32' ? 'npm.cmd' : 'npm';

          function tryLoad(id) {
            try {
              require(id);
              return null;
            } catch (err) {
              return err;
            }
          }

          function installExact(spec) {
            console.log('[ci] Installing missing/fallback package:', spec);
            execFileSync(npmCmd, ['install', '--no-save', '--legacy-peer-deps', '--force', spec], {
              stdio: 'inherit',
              shell: true,
            });
          }

          const rolldownVer = require('./node_modules/rolldown/package.json').version;
          let err = tryLoad('@rolldown/binding-win32-x64-msvc');
          if (err) {
            console.warn('[ci] Native @rolldown/binding-win32-x64-msvc unavailable:', err.message);
            installExact('@rolldown/binding-win32-x64-msvc@' + rolldownVer);
            err = tryLoad('@rolldown/binding-win32-x64-msvc');
          }
          if (err) {
            console.warn('[ci] Native rolldown still unavailable; installing WASI fallback:', err.message);
            installExact('@rolldown/binding-wasm32-wasi@' + rolldownVer);
          }

          const lightningVer = require('./node_modules/lightningcss/package.json').version;
          if (tryLoad('lightningcss-win32-x64-msvc')) {
            installExact('lightningcss-win32-x64-msvc@' + lightningVer);
          }

          const oxideVer = require('./node_modules/@tailwindcss/oxide/package.json').version;
          if (tryLoad('@tailwindcss/oxide-win32-x64-msvc')) {
            installExact('@tailwindcss/oxide-win32-x64-msvc@' + oxideVer);
            if (tryLoad('@tailwindcss/oxide-win32-x64-msvc') && tryLoad('@tailwindcss/oxide-wasm32-wasi')) {
              installExact('@tailwindcss/oxide-wasm32-wasi@' + oxideVer);
            }
          }
          '@ | node --input-type=commonjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "Promise.all([import('rolldown/parseAst'), import('@tailwindcss/vite')]).then(() => console.log('[ci] rolldown and tailwindcss bindings OK')).catch((e) => { console.error(e); process.exit(1); })"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck and run unit tests
        working-directory: ${{ runner.temp }}/repo
        run: |
          npm run lint
          npm test

      - name: Verify Electron & Windows icon assets
        working-directory: ${{ runner.temp }}/repo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'build' -Force | Out-Null
          if (-not (Test-Path 'build/icon.ico') -and (Test-Path 'electron/icon.ico')) {
            Copy-Item 'electron/icon.ico' 'build/icon.ico' -Force
          }
          if (-not (Test-Path 'build/icon.png') -and (Test-Path 'electron/icon.png')) {
            Copy-Item 'electron/icon.png' 'build/icon.png' -Force
          }
          $required = @('build/icon.ico', 'build/icon.png', 'electron/icon.ico', 'electron/icon.png')
          foreach ($file in $required) {
            if (-not (Test-Path $file) -or ((Get-Item $file).Length -eq 0)) {
              throw "Missing or empty required icon asset: $file"
            }
          }

      - name: Build web bundle
        working-directory: ${{ runner.temp }}/repo
        run: npm run build

      - name: Package Windows NSIS & Portable (.exe)
        working-directory: ${{ runner.temp }}/repo
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Surround-X-Windows-exe
          path: ${{ runner.temp }}/repo/release/*.exe
          if-no-files-found: error
